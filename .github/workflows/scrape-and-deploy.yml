name: Scrape hut availability & deploy to Firebase

on:
  schedule:
    # 目標：每小時更新一次。
    # GitHub 的排程是「盡力而為」：整點與半點是全球尖峰，常被延後或整個丟掉
    # （2026-11-28 實測：原本 "*/30" 跑了 12.5 小時只觸發 1 次）。
    # 對策：避開尖峰挑奇數分鐘，且一小時排兩次互為備援；
    # 下面的「新鮮度閘門」會讓第二次在資料還新時直接跳過，不會多打官方網站。
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Workload Identity 聯合：用 GitHub 的 OIDC 換 Google 短期憑證，不存任何金鑰

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Taipei # 爬蟲用「今天」決定抓哪幾個月，要用台灣日期

    steps:
      # 只有排程觸發才看閘門；手動按 Run workflow 或推送一律照跑。
      # 線上資料不到 45 分鐘就跳過，所以兩個排程都觸發時，一小時仍只爬一次。
      # 讀不到線上 meta.json（網站掛了、格式變了）就當作過期，寧可多爬一次。
      - name: Freshness gate (skip if live data is still fresh)
        id: gate
        env:
          MAX_AGE_MINUTES: "45"
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "非排程觸發（${{ github.event_name }}），照跑。"; exit 0
          fi
          fetched=$(curl -fsS --max-time 20 https://taiwan-hut-availability.web.app/data/meta.json \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["fetched_at"])' 2>/dev/null || true)
          if [ -z "$fetched" ] || ! fetched_epoch=$(date -d "$fetched" +%s 2>/dev/null); then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "讀不到線上 fetched_at，當作過期，照跑。"; exit 0
          fi
          age=$(( ( $(date +%s) - fetched_epoch ) / 60 ))
          echo "線上資料更新於 $fetched，已過 ${age} 分鐘（門檻 ${MAX_AGE_MINUTES}）。"
          if [ "$age" -lt "$MAX_AGE_MINUTES" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "資料還新，這次跳過。"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install httpx==0.29.0 beautifulsoup4==4.15.0 selectolax==1.0.2 pytest==9.2.0

      - name: Run parser unit tests
        if: steps.gate.outputs.run == 'true'
        run: pytest -q

      - name: Run polite scraper (1.5s interval, single concurrency)
        if: steps.gate.outputs.run == 'true'
        # 會把 data/*.json 同步一份到 web/data/，部署用的就是這份
        run: python run_scrape.py --months-ahead 2 --interval 1.5

      - name: Authenticate to Google Cloud (keyless)
        if: steps.gate.outputs.run == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/256220960147/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@taiwan-hut-availability.iam.gserviceaccount.com

      - name: Deploy web/ to Firebase Hosting
        if: steps.gate.outputs.run == 'true'
        run: npx --yes firebase-tools@15.37.0 deploy --only hosting --project taiwan-hut-availability --non-interactive
