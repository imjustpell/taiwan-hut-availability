name: Scrape hut availability & deploy to Firebase

on:
  schedule:
    # 每 30 分鐘一次（UTC）。GitHub 排程在尖峰時段可能延遲幾分鐘。
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Workload Identity 聯合：用 GitHub 的 OIDC 換 Google 短期憑證，不存任何金鑰

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 selectolax pytest

      - name: Run parser unit tests
        run: pytest -q

      - name: Run polite scraper (1.5s interval, single concurrency)
        # 會把 data/*.json 同步一份到 web/data/，部署用的就是這份
        run: python run_scrape.py --months-ahead 2 --interval 1.5

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/256220960147/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@taiwan-hut-availability.iam.gserviceaccount.com

      - name: Deploy web/ to Firebase Hosting
        run: npx --yes firebase-tools@15.37.0 deploy --only hosting --project taiwan-hut-availability --non-interactive
