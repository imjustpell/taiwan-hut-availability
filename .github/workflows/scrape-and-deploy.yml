name: Scrape Hut Availability & Deploy GitHub Pages

on:
  schedule:
    # 每 2 小時自動執行一次禮貌爬蟲 (UTC 整點)
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scrape-and-pages"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 selectolax pytest

      - name: Run parser & scraper unit tests
        run: |
          pytest -v

      - name: Run polite scraper (1.5s interval, single concurrency)
        run: |
          python run_scrape.py --months-ahead 2 --interval 1.5

      - name: Commit updated data/*.json to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update hut availability data [skip ci]"
            git push
          fi

      - name: Prepare static site artifact (web + data)
        run: |
          mkdir -p web/data
          cp data/*.json web/data/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
