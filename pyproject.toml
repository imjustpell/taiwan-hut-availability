[project]
name = "taiwan-hut-availability"
version = "1.0.0"
description = "Taiwan National Park Mountain Hut & Campsite Future Weekend Availability Aggregator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "selectolax>=0.3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
run_scrape = "scraper.src.scraper:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scraper/tests"]
